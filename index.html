<html lang="zh-Hant">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>德語 A2 單字備考 App</title>

  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="德語A2">

<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --card2:#f0f2f8; --ink:#1a2233; --muted:#6b7590;
  --line:#e3e7f0; --brand:#4f6ef7; --brand-ink:#fff; --accent:#f7b23b;
  --good:#2fa36b; --bad:#e0524a; --hard:#e88a2f; --easy:#3b93e8;
  --star:#f5b301; --shadow:0 6px 22px rgba(31,45,90,.10); --radius:18px;
}
:root[data-theme="dark"], :root.dark{
  --bg:#0f1320; --card:#191f30; --card2:#212a41; --ink:#eef1f8; --muted:#9aa4c0;
  --line:#2b344c; --brand:#5b7bff; --brand-ink:#fff; --accent:#ffc35a;
  --good:#37c07f; --bad:#ff6b62; --hard:#ff9d40; --easy:#5aa6ff;
  --star:#ffcf3f; --shadow:0 8px 26px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1320; --card:#191f30; --card2:#212a41; --ink:#eef1f8; --muted:#9aa4c0;
    --line:#2b344c; --brand:#5b7bff; --brand-ink:#fff; --accent:#ffc35a;
    --good:#37c07f; --bad:#ff6b62; --hard:#ff9d40; --easy:#5aa6ff;
    --star:#ffcf3f; --shadow:0 8px 26px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
.app{max-width:720px;margin:0 auto;padding:0 16px 96px;min-height:100vh}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);padding:14px 0 8px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo .flag{font-size:22px}
.logo small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.02em}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand)}

/* generic */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:12px}
.grid{display:grid;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--muted);font-size:12px;font-weight:700}
.pill.noun{background:rgba(79,110,247,.14);color:var(--brand)}
.pill.verb{background:rgba(47,163,107,.16);color:var(--good)}
.pill.other{background:rgba(247,178,59,.18);color:var(--hard)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:13px 18px;border-radius:14px;font-size:15px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
.muted{color:var(--muted)}
.sechead{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:22px 4px 10px}

/* dashboard */
.hero{background:linear-gradient(135deg,var(--brand),#7a63ff);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h2{font-size:15px;opacity:.9;font-weight:700}
.hero .big{font-size:44px;font-weight:800;margin:4px 0 2px}
.hero .sub{opacity:.92;font-size:13px}
.hero .ring{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.streak{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;color:var(--muted);font-weight:700;font-size:13px}

/* flashcard */
.fcwrap{perspective:1600px;margin-top:10px}
.flash{position:relative;min-height:420px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--card);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.emoji{font-size:74px;text-align:center;line-height:1;margin:6px 0 2px}
.word{font-size:32px;font-weight:800;text-align:center}
.forms{text-align:center;color:var(--muted);font-size:14px;margin-top:4px;font-weight:600}
.tap-hint{margin-top:auto;text-align:center;color:var(--muted);font-size:12px}
.en-mean{font-size:22px;font-weight:800;text-align:center;color:var(--brand)}
.exlist{margin-top:12px;overflow:auto;flex:1}
.ex{background:var(--card2);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.ex .de{font-weight:600;font-size:15px}
.ex .en{color:var(--muted);font-size:13px;margin-top:3px}
.ex .spk{float:right;margin-left:8px}
.spk{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:15px}
.face.front .spk{background:var(--card2)}
.cardtop{display:flex;justify-content:space-between;align-items:center}
.star{font-size:22px;color:var(--line)}
.star.on{color:var(--star)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grade{padding:12px 4px;border-radius:14px;font-weight:800;font-size:13px;color:#fff;text-align:center;box-shadow:var(--shadow)}
.grade small{display:block;font-weight:600;font-size:10px;opacity:.9;margin-top:2px}
.g-again{background:var(--bad)} .g-hard{background:var(--hard)} .g-good{background:var(--good)} .g-easy{background:var(--easy)}
.progressbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:2px 0 10px}
.progressbar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}

/* quiz */
.qopt{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;margin-bottom:10px;box-shadow:var(--shadow);transition:.15s}
.qopt:active{transform:translateY(1px)}
.qopt.correct{border-color:var(--good);background:rgba(47,163,107,.12)}
.qopt.wrong{border-color:var(--bad);background:rgba(224,82,74,.12)}
.qopt.dim{opacity:.5}
.qprompt{font-size:30px;font-weight:800;text-align:center;margin:8px 0}

/* list */
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.litem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.litem .em{font-size:26px}
.litem .w{font-weight:800}
.litem .m{color:var(--muted);font-size:13px}
.litem .st{margin-left:auto;font-size:20px;color:var(--line)}
.litem .st.on{color:var(--star)}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--muted)}
.badge.diff{background:rgba(224,82,74,.15);color:var(--bad)}
.badge.new{background:rgba(79,110,247,.15);color:var(--brand)}
.badge.done{background:rgba(47,163,107,.15);color:var(--good)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,25,.55);display:grid;place-items:end center;padding:0}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.sheet h3{font-size:20px;margin-bottom:4px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--card2);font-size:18px;font-weight:800}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:23px}
.bak{width:100%;height:120px;margin:10px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty .big{font-size:50px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
a{color:var(--brand)}
</style>
</head>

/* ================= State / storage ================= */
const LSKEY='goethe_a2_srs_v1';
const pad2=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>fmtDate(new Date());                 // local date, timezone-safe
const addDays=(d,n)=>{const[y,m,day]=d.split('-').map(Number);return fmtDate(new Date(y,m-1,day+n));};
const TODAY=todayStr();

const DEFAULT_SETTINGS={newPerDay:15, maxReviews:120, dir:'de-en', autoPlay:true, theme:'system'};
let S=load();
function load(){
  let s;
  try{ s=JSON.parse(localStorage.getItem(LSKEY)) }catch(e){}
  if(!s) s={};
  s.srs=s.srs||{};            // id -> {ease,iv,reps,lapses,due,st}
  s.flags=s.flags||{};        // id -> {star:1}
  s.settings=Object.assign({},DEFAULT_SETTINGS,s.settings||{});
  s.introducedToday=s.introducedToday||{date:TODAY,ids:[]};
  if(s.introducedToday.date!==TODAY) s.introducedToday={date:TODAY,ids:[]};
  s.log=s.log||{};            // date -> {studied,correct,total}
  s.streak=s.streak||0;
  s.lastActive=s.lastActive||null;
  s.wrong=s.wrong||{};        // id -> 1 (recent wrong / session)
  return s;
}
function save(){ localStorage.setItem(LSKEY,JSON.stringify(S)); }

/* streak bookkeeping */
(function initStreak(){
  if(S.lastActive!==TODAY){
    const y=addDays(TODAY,-1);
    if(S.lastActive===y) S.streak=(S.streak||0)+1;
    else if(S.lastActive) S.streak=1;
    else S.streak=1;
    // don't reset to 0 until they actually miss & reopen; keep simple
  }
})();

/* ================= SRS (SM-2) ================= */
function cardState(id){
  return S.srs[id] || {ease:2.5, iv:0, reps:0, lapses:0, due:null, st:'new'};
}
function isNew(id){ return !S.srs[id] || S.srs[id].st==='new'; }
function isDue(id){ const c=S.srs[id]; return c && c.due && c.due<=TODAY; }
function isDifficult(id){ const c=S.srs[id]; return !!(S.wrong[id]) || (c && (c.lapses>=2 || c.ease<2.0)); }
function isMastered(id){ const c=S.srs[id]; return c && c.iv>=21; }
function isStar(id){ return !!(S.flags[id]&&S.flags[id].star); }

function grade(id,g){ // g: 0 again,1 hard,2 good,3 easy
  let c=Object.assign({},cardState(id));
  if(g===0){
    c.reps=0; c.lapses++; c.ease=Math.max(1.3,c.ease-0.2); c.iv=0; c.st='learning';
    c.due=TODAY; S.wrong[id]=1;
  }else{
    if(c.st==='new'||c.st==='learning'){
      c.iv = g===1?1 : g===2?1 : 2;      // graduate
      if(g===3) c.iv=3;
      c.reps=1; c.st='review';
    }else{
      if(g===1){ c.ease=Math.max(1.3,c.ease-0.15); c.iv=Math.max(1,Math.round(c.iv*1.2)); }
      else if(g===2){ c.iv=Math.max(1,Math.round(c.iv*c.ease)); }
      else { c.ease+=0.15; c.iv=Math.max(2,Math.round(c.iv*c.ease*1.3)); }
      c.reps++;
    }
    if(g===3) c.ease+=0.05;
    c.due=addDays(TODAY,c.iv);
    if(g>=2) delete S.wrong[id];
  }
  S.srs[id]=c;
  logStudy(g>0);
  save();
}
function logStudy(correct){
  S.lastActive=TODAY;
  const L=S.log[TODAY]||{studied:0,correct:0,total:0};
  L.studied++; L.total++; if(correct)L.correct++;
  S.log[TODAY]=L;
}

/* queues */
function dueReviewIds(){ return VOCAB.map(v=>v.id).filter(id=>!isNew(id)&&isDue(id)); }
function newQueueIds(){
  const already=S.introducedToday.ids.length;
  const room=Math.max(0,S.settings.newPerDay-already);
  const ids=VOCAB.map(v=>v.id).filter(id=>isNew(id)&&!S.introducedToday.ids.includes(id));
  return ids.slice(0,room);
}
function todayQueue(){
  // due reviews first, then new
  return dueReviewIds().concat(newQueueIds());
}
function byId(id){ return VMAP[id]; }
const VMAP={}; VOCAB.forEach(v=>VMAP[v.id]=v);

/* ================= audio (Web Speech) ================= */
let deVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  deVoice = vs.find(v=>/de[-_]DE/i.test(v.lang)&&/(Anna|Petra|Markus|Google)/i.test(v.name))
        || vs.find(v=>/de[-_]DE/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,rate){
  if(!('speechSynthesis' in window)){ toast('此瀏覽器不支援語音'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='de-DE'; u.rate=rate||0.92; if(deVoice)u.voice=deVoice;
  speechSynthesis.speak(u);
}

const view=document.getElementById('view');
const posLabel={noun:'名詞',verb:'動詞',other:'其他'};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
function speakerBtn(text){ return `<button class="spk" onclick="event.stopPropagation();speak(${JSON.stringify(text).replace(/"/g,'&quot;')})">🔊</button>`; }

let session=null; // {ids:[], i:0, mode}
function startLearn(mode){
  let ids;
  if(mode==='today') ids=todayQueue();
  else if(mode==='diff') ids=VOCAB.map(v=>v.id).filter(isDifficult);
  else if(mode==='star') ids=VOCAB.filter(v=>isStar(v.id)).map(v=>v.id);
  else if(mode==='all') ids=VOCAB.map(v=>v.id);
  if(!ids||!ids.length){ toast(mode==='diff'?'目前沒有困難字 🎉':mode==='star'?'還沒有收藏字':'今日已完成 🎉'); TAB='home'; render(); return; }
  session={ids:shuffleKeepDueFirst(ids,mode),i:0,mode,again:[]};
  TAB='learn'; render();
}
function shuffleKeepDueFirst(ids,mode){
  if(mode==='today') return ids; // already ordered
  const a=ids.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a;
}
function renderLearn(){
  if(!session){
    const due=todayQueue().length;
    view.innerHTML=`<div class="empty"><div class="big">📇</div><h3>單字卡學習</h3>

      <button class="btn wide" onclick="startLearn('today')">開始今日學習（${due}）</button>
      <div style="height:10px"></div>
      <button class="btn ghost wide" onclick="startLearn('all')">瀏覽全部單字卡</button></div>`;
    return;
  }
  if(session.i>=session.ids.length){
    // handle 'again' requeue for today mode handled inline; finish
    const done=session.ids.length;
    view.innerHTML=`<div class="empty"><div class="big">🎉</div><h3>這一輪完成！</h3>
      <p class="muted">本輪共複習 ${done} 張單字卡。</p>

  view.innerHTML=`
    <div class="progressbar"><i style="width:${session.i/session.ids.length*100}%"></i></div>
    <div class="muted" style="text-align:center;font-size:12px;margin-bottom:6px">${session.i+1} / ${session.ids.length}　${{today:'今日學習',diff:'困難字複習',star:'收藏字複習',all:'全部瀏覽'}[session.mode]}</div>

        <div class="emoji">${v.emoji||'🇩🇪'}</div>
        <div class="word">${esc(v.word)}</div>
        <div class="forms">${esc(v.forms||'')}</div>
        <div style="text-align:center;margin-top:14px">${speakerBtn(v.word)}</div>
        <div class="tap-hint">點卡片翻面看解釋 ›</div>
      </div>
      <div class="face back">
        <div class="cardtop"><span class="pill ${v.pos}">${esc(v.word)}</span>
          <span class="star ${isStar(v.id)?'on':''}" onclick="event.stopPropagation();toggleStar(${v.id});renderLearn()">★</span></div>
        <div style="margin-top:6px" class="en-mean">${esc(v.en||'（英文解釋待補）')}</div>

          <div class="grade g-hard" onclick="doGrade(1)">困難<small>短</small></div>

function doGrade(g){
  const v=byId(session.ids[session.i]);

  session.i++;
  renderLearn();
}
function toggleStar(id){ S.flags[id]=S.flags[id]||{}; S.flags[id].star=S.flags[id].star?0:1; if(!S.flags[id].star)delete S.flags[id]; save(); }

/* ---- QUIZ ---- */
let quiz=null;
function renderQuiz(){
  if(!quiz){
    const due=todayQueue().length, diff=VOCAB.filter(v=>isDifficult(v.id)).length, learned=VOCAB.filter(v=>!isNew(v.id)).length;
    view.innerHTML=`
      <div class="sechead">選擇測驗範圍</div>
      <div class="grid">
        <button class="btn wide" onclick="startQuiz('today')">📆 今日到期單字（${due}）</button>
        <button class="btn ghost wide" onclick="startQuiz('diff')" style="border-color:var(--bad);color:var(--bad)">🔥 只考困難字／錯題（${diff}）</button>
        <button class="btn ghost wide" onclick="startQuiz('star')">⭐ 只考收藏字（${VOCAB.filter(v=>isStar(v.id)).length}）</button>
        <button class="btn ghost wide" onclick="startQuiz('learned')">📚 已學過的字隨機考（${learned}）</button>
        <button class="btn ghost wide" onclick="startQuiz('all')">🎲 全部單字隨機考（${VOCAB.length}）</button>
      </div>
      <div class="sechead">測驗方向</div>
      <div class="seg" id="dirseg">
        <button class="${S.settings.dir==='de-en'?'on':''}" onclick="setDir('de-en')">德 → 英</button>
        <button class="${S.settings.dir==='en-de'?'on':''}" onclick="setDir('en-de')">英 → 德</button>
      </div>
      <div class="card muted" style="font-size:13px;margin-top:14px">答錯的字會自動加入<b style="color:var(--bad)">困難字</b>並縮短再出現的間隔；答對則依記憶曲線延長。可隨時用上方「只考困難字／錯題」單獨攻克弱點。</div>`;
    return;
  }
  if(quiz.i>=quiz.qs.length){
    const pct=Math.round(quiz.correct/quiz.qs.length*100);
    view.innerHTML=`<div class="empty"><div class="big">${pct>=80?'🏆':pct>=50?'👍':'💪'}</div>
      <h3>測驗結束</h3>
      <p class="muted">答對 ${quiz.correct} / ${quiz.qs.length}（${pct}%）</p>
      ${quiz.wrongIds.length?`<button class="btn wide" style="background:var(--bad)" onclick="startQuizIds(quiz.wrongIds.slice())">重考這 ${quiz.wrongIds.length} 個錯題</button><div style="height:10px"></div>`:''}
      <button class="btn ghost wide" onclick="quiz=null;render()">回測驗選單</button></div>`;
    quiz=null; return;
  }
  const q=quiz.qs[quiz.i], v=byId(q.id), dir=quiz.dir;
  const prompt = dir==='de-en'? v.word : (v.en||v.word);
  const promptSpk = dir==='de-en'? speakerBtn(v.word):'';
  view.innerHTML=`
    <div class="progressbar"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>
    <div class="muted" style="text-align:center;font-size:12px;margin-bottom:4px">第 ${quiz.i+1} / ${quiz.qs.length} 題 · 答對 ${quiz.correct}</div>
    <div class="card">
      <div class="muted" style="text-align:center;font-size:13px">${dir==='de-en'?'這個德文字是什麼意思？':'哪個德文字符合此意思？'}</div>
      <div class="qprompt">${esc(prompt)} ${promptSpk}</div>
      ${dir==='de-en'&&v.forms?`<div class="forms">${esc(v.forms)}</div>`:''}
    </div>
    <div style="height:14px"></div>
    <div id="opts">${q.opts.map((o,k)=>`<button class="qopt" data-k="${k}" onclick="answer(${k})">${esc(dir==='de-en'?(o.en||o.word):o.word)}</button>`).join('')}</div>`;
}
function setDir(d){ S.settings.dir=d; save(); renderQuiz(); }
function startQuiz(scope){
  let pool;
  if(scope==='today') pool=todayQueue();
  else if(scope==='diff') pool=VOCAB.map(v=>v.id).filter(isDifficult);
  else if(scope==='star') pool=VOCAB.filter(v=>isStar(v.id)).map(v=>v.id);
  else if(scope==='learned') pool=VOCAB.filter(v=>!isNew(v.id)).map(v=>v.id);
  else pool=VOCAB.map(v=>v.id);
  if(!pool.length){ toast(scope==='diff'?'目前沒有困難字 🎉':'此範圍暫無單字'); return; }
  startQuizIds(pool);
}
function startQuizIds(pool){
  const a=pool.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  const ids=a.slice(0,Math.min(20,a.length));
  const qs=ids.map(id=>({id,opts:makeOpts(id)}));
  quiz={qs,i:0,correct:0,dir:S.settings.dir,wrongIds:[]};
  TAB='quiz'; render();
}
function makeOpts(id){
  const v=byId(id);
  const samePos=VOCAB.filter(x=>x.id!==id && x.pos===v.pos && (x.en||x.word));
  const pool=samePos.length>=3?samePos:VOCAB.filter(x=>x.id!==id);
  const picks=[]; const used=new Set([id]);
  while(picks.length<3 && used.size<VOCAB.length){
    const c=pool[Math.random()*pool.length|0]; if(used.has(c.id))continue; used.add(c.id); picks.push(c);
  }
  const opts=picks.concat([v]);
  for(let i=opts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[opts[i],opts[j]]=[opts[j],opts[i]];}
  return opts;
}
function answer(k){
  const q=quiz.qs[quiz.i], v=byId(q.id);
  const correctK=q.opts.findIndex(o=>o.id===v.id);
  const ok=k===correctK;
  document.querySelectorAll('#opts .qopt').forEach((b,idx)=>{
    b.onclick=null;
    if(idx===correctK)b.classList.add('correct');
    else if(idx===k)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(ok){ quiz.correct++; grade(v.id,2); }
  else { quiz.wrongIds.push(v.id); grade(v.id,0); }
  if(S.settings.autoPlay) speak(v.word);
  setTimeout(()=>{ quiz.i++; renderQuiz(); }, ok?650:1250);
}

        <span class="st ${isStar(v.id)?'on':''}" onclick="event.stopPropagation();toggleStar(${v.id});renderList()">★</span>
      </div>`).join('')||'<div class="empty">找不到符合的單字</div>'}${items.length>300?'<div class="muted" style="text-align:center;padding:10px">僅顯示前 300 筆，請用搜尋縮小範圍</div>':''}</div>`;

function copyBak(){
  const t=document.getElementById('bak'); t.select(); t.setSelectionRange(0,999999);

  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t.value); ok=true; } }catch(e){}

    <div class="setrow"><div>每日新單字上限<div class="muted" style="font-size:12px">建議 10–20</div></div>
      <div class="stepper"><button onclick="chgSet('newPerDay',-5)">−</button><b id="v_new">${S.settings.newPerDay}</b><button onclick="chgSet('newPerDay',5)">＋</button></div></div>
    <div class="setrow"><div>翻卡自動朗讀德文</div>
      <div class="switch ${S.settings.autoPlay?'on':''}" id="sw_auto" onclick="chgSet('autoPlay',null);this.classList.toggle('on')"><i></i></div></div>
    <div class="setrow"><div>外觀主題</div>
      <div class="seg" style="width:220px">
        <button class="${S.settings.theme==='system'?'on':''}" onclick="setTheme('system')">系統</button>
        <button class="${S.settings.theme==='light'?'on':''}" onclick="setTheme('light')">淺色</button>
        <button class="${S.settings.theme==='dark'?'on':''}" onclick="setTheme('dark')">深色</button>
      </div></div>
    <div class="setrow"><div>語音測試</div><button class="btn ghost" onclick="speak('Guten Tag! Wie geht es Ihnen?')">🔊 試聽德文</button></div>
    <div class="setrow" style="display:block"><div class="muted" style="font-size:12px">
      資料來源：${esc(META.source)}｜共 ${VOCAB.length} 詞。發音使用瀏覽器內建德語語音（若無聲請確認系統已安裝德文語音）。進度自動儲存於本機瀏覽器。</div></div>
    <button class="btn ghost wide" style="margin-top:14px;color:var(--bad)" onclick="if(confirm('確定清除所有學習進度？此動作無法復原。')){localStorage.removeItem(LSKEY);S=load();closeSheet();render();toast('已重設全部進度');}">清除所有進度</button>
  `);
};
function chgSet(k,d){
  if(k==='autoPlay'){ S.settings.autoPlay=!S.settings.autoPlay; }
  else { S.settings[k]=Math.max(0,Math.min(60,S.settings[k]+d)); const el=document.getElementById('v_'+ (k==='newPerDay'?'new':k)); if(el)el.textContent=S.settings[k]; }
  save();
}
function setTheme(t){ S.settings.theme=t; save(); applyTheme(); document.querySelectorAll('.sheet .seg button').forEach(b=>{}); closeSheet(); document.getElementById('btnSettings').click(); }
function applyTheme(){
  const t=S.settings.theme;
  if(t==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}

/* ---- modal sheet ---- */
function showSheet(html){
  const m=document.createElement('div'); m.className='modal'; m.onclick=e=>{if(e.target===m)closeSheet();};
  m.innerHTML=`<div class="sheet">${html}</div>`; document.body.appendChild(m); window._sheet=m;
}
function closeSheet(){ if(window._sheet){window._sheet.remove();window._sheet=null;} }

/* nav */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab; if(TAB==='learn')session=session; render();});
applyTheme(); render();
</script>
